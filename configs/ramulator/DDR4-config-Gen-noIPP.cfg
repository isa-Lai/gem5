# DDR4 Configuration for InterStellar Ramulator — NO-IPP (stock) baseline
# Identical to DDR4-config-Gen.cfg EXCEPT row_policy = Opened.
# Used by experimental Arm E ("ramulator-no-ipp") to isolate the IPP row-policy
# contribution: (Arm C IPP) - (Arm E Opened) = pure IPP policy effect.
# Only row_policy differs; scheduling_policy is held constant so the comparison
# is a single-variable control. With Opened, isConfigIPP=false and every
# IPP/MetaISA window-counter path early-returns (see Controller.h:~1682),
# so this runs safely with --meta-isa-type=None.

# Required ramulator core parameters
standard     = DDR4
cores        = 1
channels     = 1
ranks        = 1
subarrays    = 4
rows         = 65536
columns      = 1024
cpu_tick     = 3200
mem_tick     = 3200
expected_limit_insts = 0
warmup_insts = 0

# Policy keys — ONLY row_policy changed vs DDR4-config-Gen.cfg
scheduling_policy = FRFCFS_PriorHit
row_policy       = Opened
address_mapping  = RoBaRaCoCh
InDir_Str_Win    = 50
Unified_Win      = 50
metaisa_none_window_threshold     = 0.5
metaisa_none_window_threshold_Low = 0.5
metaisa_indir_window_threshold     = 0.5
metaisa_indir_window_threshold_Low = 0.5

# Trace keys (optional; ignored under non-IPP)
print_cmd_trace      = off
memory_trace         = 0
print_ipp_cmd_trace  = 0
print_ipp_logic_trace = off
