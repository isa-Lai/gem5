# DDR4 Configuration for InterStellar Ramulator
# Paper config: DDR4_2440R, 4 BG × 4 banks

# Required ramulator core parameters
standard     = DDR4
cores        = 1
channels     = 1
ranks        = 1
subarrays    = 4
rows         = 65536
columns      = 1024
cpu_tick     = 3200
mem_tick     = 3200
expected_limit_insts = 0
warmup_insts = 0

# InterStellar policy keys
scheduling_policy = FRFCFS_PriorHit
row_policy       = IPP
address_mapping  = RoBaRaCoCh
InDir_Str_Win    = 50
Unified_Win      = 50
metaisa_none_window_threshold     = 0.5
metaisa_none_window_threshold_Low = 0.5
metaisa_indir_window_threshold     = 0.5
metaisa_indir_window_threshold_Low = 0.5

# Trace keys (optional)
print_cmd_trace      = off
memory_trace         = 0
print_ipp_cmd_trace  = 0
print_ipp_logic_trace = off
